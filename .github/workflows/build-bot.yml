name: Build and push discord-bot

on:
  push:
    branches: [main]
    paths:
      - "discord_bot/**"
      - ".github/workflows/build-bot.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/filipcsupka/k8s-ai-agent-discord-bot

jobs:
  build:
    name: Build → push → update infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: discord_bot
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:latest

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: Filipcsupka/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Update bot image tag in prod overlay
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i '/- name:.*discord-bot/{n;n;s/newTag:.*/newTag: '"${TAG}"'/}' \
            infra/gitops/apps/k8s-ai-agent/overlays/prod/kustomization.yaml
          echo "Bot image tag → ${TAG}"

      - name: Commit and push to infra
        working-directory: infra
        env:
          PAT: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PAT}@github.com/Filipcsupka/infra.git"
          git add gitops/apps/k8s-ai-agent/overlays/prod/kustomization.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(discord-bot): deploy sha-${GITHUB_SHA::7}"
          git push
