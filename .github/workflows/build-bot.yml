name: Build and push discord-bot

on:
  push:
    branches: [main]
    paths:
      - "discord_bot/**"
      - ".github/workflows/build-bot.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/filipcsupka/k8s-ai-agent-discord-bot

jobs:
  build:
    name: Build → push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: discord_bot
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha && github.sha[:7] || 'latest' }}
            ${{ env.IMAGE }}:latest
