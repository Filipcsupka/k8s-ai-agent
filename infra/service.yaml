apiVersion: v1
kind: Service
metadata:
  name: k8s-ai-agent
  namespace: ai-agent
spec:
  selector:
    app: k8s-ai-agent
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  # ClusterIP only — AlertManager reaches it via in-cluster DNS.
  # No Ingress needed: this is an internal ops tool, not a public endpoint.
  type: ClusterIP
